<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Permit Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', 'monospace'],
                    },
                    colors: {
                        'glass': {
                            50: 'rgba(255, 255, 255, 0.05)',
                            100: 'rgba(255, 255, 255, 0.1)',
                            200: 'rgba(255, 255, 255, 0.15)',
                        },
                        'dark': {
                            800: 'rgba(15, 15, 15, 0.95)',
                            900: 'rgba(0, 0, 0, 0.95)',
                        }
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            overflow: hidden;
        }
        
        /* Custom Tailwind Components */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        /* Enhanced Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: linear-gradient(145deg, rgba(55, 65, 81, 0.8), rgba(31, 41, 55, 0.9));
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(75, 85, 99, 0.5);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch.active {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .toggle-slider {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 20px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        /* Enhanced Popup Styling */
        .mapboxgl-popup-content {
            background: rgba(15, 15, 15, 0.95);
            color: #ffffff;
            border-radius: 12px;
            padding: 16px;
            min-width: 280px;
            max-width: 350px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(20px);
            font-family: 'JetBrains Mono', monospace;
        }
        .mapboxgl-popup-content h3 {
            margin: 0 0 12px 0;
            color: #60a5fa;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 8px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .mapboxgl-popup-close-button {
            color: #ffffff;
            font-size: 20px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .mapboxgl-popup-close-button:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        /* --- Enhanced Popup Styling --- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-card {
            position: relative;
            background: linear-gradient(145deg, rgba(30,41,59,0.85), rgba(17,24,39,0.85));
            padding: 8px 10px 10px 10px;
            border-radius: 8px;
            border: 1px solid rgba(59,130,246,0.25);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 2px 6px -1px rgba(0,0,0,0.6);
        }
        .stat-card:before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            opacity: 0.9;
        }
        .stat-label { font-size: 10px; letter-spacing: .3px; text-transform: uppercase; color: #93c5fd; font-weight: 600; }
        .stat-value { font-size: 16px; font-weight: 700; color: #ffffff; line-height: 1.1; margin-top: 3px; }
        .stat-sub { font-size: 10px; color: #9ca3af; margin-top: 2px; }
        .progress-wrapper { margin: 3px 0 12px 0; }
        .progress-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
        .progress-head span { font-size:11px; font-weight:600; color:#d1d5db; }
        .progress-bar { position:relative; background:rgba(31,41,55,0.6); border:1px solid rgba(59,130,246,0.3); height:12px; border-radius:6px; overflow:hidden; }
        .progress-fill { position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,#1d4ed8,#2563eb,#3b82f6); box-shadow:0 0 6px #3b82f6aa; }
        .category-chips { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 10px 0; }
        .chip { font-size:10px; padding:3px 6px; border-radius:12px; background:rgba(59,130,246,0.12); border:1px solid rgba(59,130,246,0.35); color:#bfdbfe; display:inline-flex; align-items:center; gap:3px; }
        .chip-count { background:#3b82f6; color:#fff; font-weight:600; font-size:9px; padding:1px 5px; border-radius:10px; }
        .mini-bars { display:flex; flex-direction:column; gap:6px; }
        .mini-row { display:grid; grid-template-columns:80px 1fr 35px; gap:6px; align-items:center; }
        .mini-label { font-size:10px; color:#9ca3af; font-weight:500; }
        .mini-bar { position:relative; background:rgba(31,41,55,0.55); height:8px; border-radius:4px; overflow:hidden; border:1px solid rgba(59,130,246,0.25); }
        .mini-fill { position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,#0ea5e9,#3b82f6); }
        .mini-val { font-size:10px; font-weight:600; color:#e5e7eb; text-align:right; }
        .section-title { font-size:11px; font-weight:700; letter-spacing:.3px; color:#60a5fa; margin:0 0 6px 0; text-transform:uppercase; }
        .divider { margin:12px 0 8px 0; height:1px; background:linear-gradient(90deg,transparent,rgba(59,130,246,0.5),transparent); border:none; }
        .empty-msg { font-size:11px; color:#9ca3af; font-style:italic; padding:6px 0; }
        
        /* --- Bottom Drawer Styles --- */
        .bottom-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45vh;
            min-height: 200px;
            max-height: 80vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px 12px 0 0;
            color: white;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
            resize: vertical;
            overflow: hidden;
        }
        .bottom-drawer.open {
            transform: translateY(0);
        }
        .drawer-handle {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            cursor: ns-resize;
            transition: background-color 0.2s;
            position: relative;
            user-select: none;
        }
        .drawer-handle:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .handle-bar {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            transition: background-color 0.2s;
            pointer-events: none;
        }
        .drawer-handle:hover .handle-bar {
            background: rgba(255, 255, 255, 0.5);
        }
        .resize-indicator {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .drawer-handle:hover .resize-indicator {
            opacity: 1;
        }
        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }
        .drawer-title h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #60a5fa;
        }
        .feature-count {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 12px;
        }
        .close-button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .close-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .tab-navigation {
            display: flex;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-navigation::-webkit-scrollbar {
            display: none;
        }
        .tab-button {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 13px;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        .tab-button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }
        .tab-button.active {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            border-bottom-color: #60a5fa;
        }
        .tab-icon {
            font-size: 14px;
        }
        .tab-label {
            font-weight: 500;
        }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(96, 165, 250, 0.6) rgba(255, 255, 255, 0.1);
        }
        .tab-content::-webkit-scrollbar {
            width: 8px;
        }
        .tab-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(96, 165, 250, 0.8), rgba(59, 130, 246, 0.6));
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(96, 165, 250, 1), rgba(59, 130, 246, 0.8));
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .kpi-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kpi-value {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .kpi-unit {
            font-size: 14px;
            color: #94a3b8;
        }
        /* Enhanced Chart Containers */
        .chart-container {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.6), rgba(30, 41, 59, 0.4));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .chart-container:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .chart-title {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .chart-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-style: italic;
        }
        .chart-content {
            height: 300px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .charts-grid {
            display: grid;
            gap: 24px;
        }
        .charts-grid.two-column {
            grid-template-columns: 1fr 1fr;
        }
        @media (max-width: 768px) {
            .charts-grid.two-column {
                grid-template-columns: 1fr;
            }
        }
        
        /* Enhanced Loading States */
        .loading {
            text-align: center;
            color: #9ca3af;
            font-style: italic;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Glassmorphism Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        /* Enhanced Animations */
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @media (max-width: 1024px) {
            .charts-grid.two-column {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .bottom-drawer {
                height: 60vh;
            }
            .drawer-header {
                padding: 12px 16px;
            }
            .tab-content {
                padding: 16px;
            }
            .tab-button {
                padding: 10px 12px;
                font-size: 12px;
            }
        }
        
        .drawer-open-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .drawer-open-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }
        
        details.popup-details {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
        }
        details.popup-details summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            color: #bfdbfe;
            font-weight: 700;
            border-radius: 8px;
        }
        details.popup-details summary::-webkit-details-marker { display: none; }
        .summary-label { display:flex; gap:8px; align-items:center; }
        .summary-chevron { transition: transform 0.22s ease; color:#93c5fd; }
        details[open] .summary-chevron { transform: rotate(90deg); }
        .popup-details-content { margin-top:8px; padding-top:8px; border-top:1px dashed rgba(59,130,246,0.12); }
        
        /* Summary Window Styles */
        .summary-window {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            max-height: 70vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1050;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .summary-window.visible {
            opacity: 1;
            visibility: visible;
        }
        .summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px 12px 0 0;
            cursor: move;
            user-select: none;
        }
        .summary-title {
            font-size: 16px;
            font-weight: 700;
            color: #60a5fa;
            margin: 0;
        }
        .summary-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .summary-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .summary-content {
            padding: 16px;
            overflow-y: auto;
            max-height: calc(70vh - 60px);
            scrollbar-width: thin;
            scrollbar-color: rgba(96, 165, 250, 0.6) rgba(255, 255, 255, 0.1);
        }
        .summary-content::-webkit-scrollbar {
            width: 6px;
        }
        .summary-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        .summary-content::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.6);
            border-radius: 3px;
        }
        .summary-section {
            margin-bottom: 20px;
        }
        .summary-section h4 {
            font-size: 14px;
            color: #93c5fd;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        .summary-item {
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .summary-item strong {
            color: #60a5fa;
            font-weight: 600;
        }
        .summary-item .category {
            color: #a78bfa;
            font-weight: 500;
        }
        
        /* Back button styling (matches chicago-energy-retrofit.html) */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            z-index: 1100;
            transition: all 0.2s ease;
        }
        .back-button:hover { background: rgba(96, 165, 250, 0.12); color: #60a5fa; border-color: rgba(96, 165, 250, 0.28); }
    </style>
</head>
<body>
    <a href="portfolio.html" class="back-button" title="Back to Portfolio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align:middle; margin-right:8px;">
            <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Back to Portfolio
    </a>
    <div id="map" class="w-screen h-screen"></div>
    
    <!-- Summary Window -->
    <div class="summary-window" id="summary-window">
        <div class="summary-header" id="summary-header">
            <h3 class="summary-title" id="summary-title">Layer Summary</h3>
            <button class="summary-close" onclick="closeSummaryWindow()">×</button>
        </div>
        <div class="summary-content" id="summary-content">
            <!-- Content will be populated by JavaScript -->
        </div>
    </div>
    
    <!-- Enhanced Layer Control with Tailwind -->
    <div class="fixed top-4 right-4 z-10 w-72 bg-dark-800 backdrop-blur-xl text-white p-6 rounded-xl border border-blue-500/30 shadow-2xl">
        <h3 class="text-xl font-semibold mb-5 pb-3 border-b border-blue-500/30 text-blue-400">
            Map Layers
        </h3>

        // Summary window functions
        function typewriterEffect(element, htmlContent, speed = 30) {
            // Create a temporary container to parse the HTML
            const tempContainer = document.createElement('div');
            tempContainer.innerHTML = htmlContent;
            
            // Clear the target element but preserve its structure
            element.innerHTML = '';
            
            // Get all text nodes from the parsed HTML
            const textNodes = [];
            
            function extractTextNodes(node, targetParent) {
                for (let child of node.childNodes) {
                    if (child.nodeType === Node.TEXT_NODE) {
                        const text = child.textContent;
                        if (text.trim()) {
                            textNodes.push({
                                text: text,
                                parent: targetParent,
                                originalLength: text.length
                            });
                            // Create empty text node in target
                            const emptyTextNode = document.createTextNode('');
                            targetParent.appendChild(emptyTextNode);
                        }
                    } else if (child.nodeType === Node.ELEMENT_NODE) {
                        // Clone the element structure
                        const clonedElement = child.cloneNode(false);
                        targetParent.appendChild(clonedElement);
                        extractTextNodes(child, clonedElement);
                    }
                }
            }
            
            extractTextNodes(tempContainer, element);
            
            // Animate typing
            let currentNodeIndex = 0;
            let currentCharIndex = 0;
            
            function typeNextChar() {
                if (currentNodeIndex >= textNodes.length) return;
                
                const currentNode = textNodes[currentNodeIndex];
                const currentText = currentNode.text;
                
                if (currentCharIndex < currentText.length) {
                    // Find the text node in the target and update it
                    const textNode = currentNode.parent.childNodes[0];
                    if (textNode && textNode.nodeType === Node.TEXT_NODE) {
                        textNode.textContent = currentText.substring(0, currentCharIndex + 1);
                    }
                    currentCharIndex++;
                    setTimeout(typeNextChar, speed);
                } else {
                    // Move to next text node
                    currentNodeIndex++;
                    currentCharIndex = 0;
                    setTimeout(typeNextChar, speed);
                }
            }
            
            typeNextChar();
        }
        
        function showSummaryWindow(type) {
            const summaryWindow = document.getElementById('summary-window');
            const summaryTitle = document.getElementById('summary-title');
            const summaryContent = document.getElementById('summary-content');
            
            summaryTitle.textContent = summaryData[type].title;
            
            // Use typewriter effect for content while preserving HTML structure
            typewriterEffect(summaryContent, summaryData[type].content, 25);
            
            summaryWindow.classList.add('visible');
        }

        function closeSummaryWindow() {
            const summaryWindow = document.getElementById('summary-window');
            summaryWindow.classList.remove('visible');
        }

        // Make summary window draggable
        function initSummaryWindowDrag() {
            const summaryWindow = document.getElementById('summary-window');
            const summaryHeader = document.getElementById('summary-header');
            let isDragging = false;
            let startX, startY, startLeft, startTop;

            summaryHeader.addEventListener('mousedown', function(e) {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = summaryWindow.getBoundingClientRect();
                startLeft = rect.left;
                startTop = rect.top;
                
                summaryWindow.style.transform = 'none';
                summaryWindow.style.left = startLeft + 'px';
                summaryWindow.style.top = startTop + 'px';
                
                document.addEventListener('mousemove', handleDrag);
                document.addEventListener('mouseup', stopDrag);
                
                e.preventDefault();
            });

            function handleDrag(e) {
                if (!isDragging) return;
                
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                const newLeft = Math.max(0, Math.min(window.innerWidth - summaryWindow.offsetWidth, startLeft + deltaX));
                const newTop = Math.max(0, Math.min(window.innerHeight - summaryWindow.offsetHeight, startTop + deltaY));
                
                summaryWindow.style.left = newLeft + 'px';
                summaryWindow.style.top = newTop + 'px';
            }

            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', handleDrag);
                document.removeEventListener('mouseup', stopDrag);
            }
        }

        // Function to parse CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            const data = new Map();
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const rowData = {};
                headers.forEach((header, index) => {
                    const value = values[index];
                    // Convert numeric values
                    rowData[header] = isNaN(value) || value === '' ? value : Number(value);
                });
                // Use the first column as key (WARD or COMMUNITY_AREA)
                const key = values[0];
                if (key && key !== '') {
                    data.set(key, rowData);
                }
            }
            return data;
        }

        // Parse CSV to array of objects (for chart data)
        function parseCSVToArray(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const rowData = {};
                headers.forEach((header, index) => {
                    const value = values[index];
                    // Convert numeric values, handle dates
                    if (header.includes('date') || header.includes('week_start') || header.includes('month')) {
                        rowData[header] = value; // Keep as string for date parsing
                    } else {
                        rowData[header] = isNaN(value) || value === '' ? value : Number(value);
                    }
                });
                data.push(rowData);
            }
            return data;
        }

        // Load CSV file and parse to array
        async function loadCSVData(filename) {
            try {
                const response = await fetch(`./assets/data/retrofit-v2/${filename}`);
                const text = await response.text();
                return parseCSVToArray(text);
            } catch (error) {
                console.error(`Error loading ${filename}:`, error);
                return [];
            }
        }

        // Initialize the map
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11', // Dark theme
            center: [-87.6298, 41.8781], // Chicago coordinates
            zoom: 10,
            pitch: 0,
            bearing: 0
        });

        // Add navigation controls
        map.addControl(new mapboxgl.NavigationControl());

        // Add fullscreen control
        map.addControl(new mapboxgl.FullscreenControl());

        // Wait for the map to load
        map.on('load', async () => {
            console.log('Map loaded successfully');
            
            // Load CSV data
            try {
                const [wardResponse, communityResponse] = await Promise.all([
                    fetch('./assets/data/retrofit-v2/ward_summary.csv'),

                const wardCSV = await wardResponse.text();
                const communityCSV = await communityResponse.text();
                
                wardData = parseCSV(wardCSV);
                communityData = parseCSV(communityCSV);
                
                console.log('CSV data loaded:', wardData.size, 'wards,', communityData.size, 'communities');

            // Add ward boundaries source

                        'case',

                    ]
                }
            });

            // Add community boundaries outline
            map.addLayer({
                id: 'community-boundaries-line',
                type: 'line',
                source: 'community-boundaries',
                layout: {
                    visibility: 'none'
                },
                paint: {
                    'line-color': '#880',

                        'case',

            // Add highlighted communities layer for specific communities (31, 8, 26, 35, 39, 76) - Pulsing outline only
            map.addLayer({

        // Function to get analytics data for a boundary
        function getAnalyticsData(feature, boundaryType) {
            const props = feature.properties;
            let key, data;
            
            if (boundaryType === 'Ward') {
                // Try different possible ward identifier fields
                key = props.WARD || props.ward_num || props.ward || props.WARD_NUM || props.name || props.AREA_SHORT;
                data = wardData.get(String(key));
            } else {
                // For community boundaries, use area_numbe or area_num_1 which matches COMMUNITY_AREA in CSV
                key = props.area_numbe || props.area_num_1 || props.AREA_SHORT || props.AREA_S_CD || 
                      props.community || props.COMMUNITY_AREA || props.name || props.OBJECTID;
                
                // Try the area number first (this should be the main match)
                data = communityData.get(String(key));
                
                // If no match, try alternative keys
                if (!data && props.area_num_1) {
                    data = communityData.get(String(props.area_num_1));
                }
                if (!data && props.area_numbe) {
                    data = communityData.get(String(props.area_numbe));
                }
                if (!data && props.community) {
                    // Try matching by community name
                    for (let [csvKey, csvData] of communityData.entries()) {
                        if (csvData.COMMUNITY_AREA && String(csvData.COMMUNITY_AREA) === String(key)) {
                            data = csvData;
                            break;
                        }
                    }
                }
            }
            
            if (!data) {
                console.log(`No data found for ${boundaryType} with key: ${key}`);
                console.log('Available properties:', Object.keys(props));
                console.log('Sample CSV keys:', 
                    boundaryType === 'Ward' ? Array.from(wardData.keys()).slice(0, 10) : 
                    Array.from(communityData.keys()).slice(0, 10));
                return {
                    error: `No data found for ${boundaryType} ${key}`,
                    key: key
                };
            }
            
            console.log(`Found data for ${boundaryType} ${key}:`, data);
            
            return {
                key: key,
                permits: data.permits || 0,
                scoreSum: data.score_sum || 0,
                retrofitLikely: data.retrofit_likely || 0,
                heatPump: data.heat_pump || 0,
                insulation: data.insulation || 0,
                blower: data.blower || 0,
                ductwork: data.ductwork || 0,
                elecUpgrade: data.elec_upg || 0,
                hvac: data.hvac || 0,
                lighting: data.lighting || 0,
                envelope: data.envelope || 0
            };
        }

        // Function to create detailed popup content
        function createPopupContent(feature, boundaryType) {
            const data = getAnalyticsData(feature, boundaryType);
            const props = feature.properties;
            const name = props.name || props.AREA_NAME || props.ward_name || 
                        props.community_name || `${boundaryType} ${data.key}`;
            let content = `<h3>${name}</h3>`;
            if (data.error) {
                content += `<div class="loading">${data.error}</div>`;
                return content;
            }

            // Helpers
            const fmt = (v) => v !== undefined && v !== null ? v.toLocaleString() : '0';
            const safeDivPct = (num, den) => den > 0 ? Math.round((num / den) * 100) : 0;

            const retrofitRate = safeDivPct(data.retrofitLikely, data.permits);

            // Key metrics cards
            content += '<div class="stat-grid">';
            const metricCards = [
                { label: 'Permits', value: fmt(data.permits) },
                { label: 'Retrofit Likely', value: fmt(data.retrofitLikely) },
                { label: 'Retrofit Rate', value: retrofitRate + '%' },
                { label: 'Score Sum', value: fmt(data.scoreSum) }
            ];
            metricCards.forEach(m => {
                content += `<div class="stat-card"><div class="stat-label">${m.label}</div><div class="stat-value">${m.value}</div></div>`;
            });
            content += '</div>'; // stat-grid

            // Progress bar section
            content += `
                <div class="progress-wrapper">
                    <div class="progress-head"><span>Retrofit Rate</span><span class="progress-head-val">${retrofitRate}%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${retrofitRate}%;"></div></div>
                </div>
            `;

            // Category chips (show non-zero counts)
            const categories = [
                { key: 'heatPump', label: 'Heat Pump', value: data.heatPump },
                { key: 'insulation', label: 'Insulation', value: data.insulation },
                { key: 'hvac', label: 'HVAC', value: data.hvac },
                { key: 'elecUpgrade', label: 'Elec Upgrade', value: data.elecUpgrade },
                { key: 'ductwork', label: 'Ductwork', value: data.ductwork },
                { key: 'lighting', label: 'Lighting', value: data.lighting },
                { key: 'envelope', label: 'Envelope', value: data.envelope }
            ];
            const nonZeroCats = categories.filter(c => c.value > 0).sort((a,b) => b.value - a.value);
            // Collapsible categories + distribution
            content += '<hr class="divider" />';
            content += `
                <details class="popup-details">
                    <summary>
                        <div class="summary-label"><span class="section-title">Activity Categories</span></div>
                        <div class="summary-chevron">▶</div>
                    </summary>
                    <div class="popup-details-content">
            `;

            if (nonZeroCats.length === 0) {
                content += '<div class="empty-msg">No category activity recorded.</div>';
            } else {
                content += '<div class="category-chips">';
                nonZeroCats.slice(0,7).forEach(c => {
                    content += `<div class="chip"><span>${c.label}</span><span class="chip-count">${fmt(c.value)}</span></div>`;
                });
                content += '</div>';
            }

            // Distribution mini bars
            const totalCat = nonZeroCats.reduce((acc,c)=> acc + c.value, 0);
            content += '<div style="margin-top:8px;">';
            content += '<div class="section-title" style="margin-top:4px;">Category Distribution</div>';
            if (totalCat === 0) {
                content += '<div class="empty-msg">No distribution to display.</div>';
            } else {
                content += '<div class="mini-bars">';
                nonZeroCats.forEach(c => {
                    const pct = safeDivPct(c.value, totalCat);
                    content += `
                        <div class="mini-row">
                            <span class="mini-label">${c.label}</span>
                            <div class="mini-bar"><div class="mini-fill" style="width:${pct}%;"></div></div>
                            <span class="mini-val">${pct}%</span>
                        </div>`;
                });
                content += '</div>';
            }

            content += '</div></div></details>';

            return content;
        }

        // Hover state management
        let hoveredWardId = null;
        let hoveredCommunityId = null;
        
        // Pulsing animation variables
        let pulsingAnimations = {
            ward: null,
            community: null
        };
        
        // Pulsing animation functions
        function startPulsingAnimation(type) {
            const layerId = type === 'ward' ? 'highlighted-wards-line' : 'highlighted-communities-line';
            const baseColor = type === 'ward' ? '#ff6b35' : '#e74c3c';
            
            let pulseDirection = 1; // 1 for increasing, -1 for decreasing
            let opacity = 0.8;
            let width = 4;
            
            function animate() {
                // Update opacity (0.3 to 1.0)
                opacity += pulseDirection * 0.03;
                if (opacity >= 1.0) {
                    opacity = 1.0;
                    pulseDirection = -1;
                } else if (opacity <= 0.3) {
                    opacity = 0.3;
                    pulseDirection = 1;
                }
                
                // Update width (3 to 6)
                width = 3 + (opacity - 0.3) * (6 - 3) / (1.0 - 0.3);
                
                // Apply the animation
                if (map.getLayer(layerId)) {
                    map.setPaintProperty(layerId, 'line-opacity', [
                        'case',
                        ['in', ['get', type === 'ward' ? 'ward' : 'area_num_1'], 
                         ['literal', type === 'ward' ? ['42', '27', '1', '41', '39', '45'] : ['31', '8', '26', '35', '39', '76']]],
                        opacity,
                        0
                    ]);
                    
                    map.setPaintProperty(layerId, 'line-width', [
                        'case',
                        ['in', ['get', type === 'ward' ? 'ward' : 'area_num_1'], 
                         ['literal', type === 'ward' ? ['42', '27', '1', '41', '39', '45'] : ['31', '8', '26', '35', '39', '76']]],
                        width,
                        0
                    ]);
                }
                
                pulsingAnimations[type] = requestAnimationFrame(animate);
            }
            
            animate();
        }
        
        function stopPulsingAnimation(type) {
            if (pulsingAnimations[type]) {
                cancelAnimationFrame(pulsingAnimations[type]);
                pulsingAnimations[type] = null;
            }

        // Initialize resize functionality
        function initDrawerResize() {
            const drawer = document.getElementById('bottom-drawer');
            const handle = document.getElementById('drawer-handle');

            handle.addEventListener('mousedown', function(e) {
                // Check if it's a single click (not drag) to toggle
                const clickStartTime = Date.now();
                const clickStartY = e.clientY;
                
                isResizing = true;
                startY = e.clientY;
                startHeight = drawer.offsetHeight;
                
                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', function stopResize(e) {
                    document.removeEventListener('mousemove', handleResize);
                    document.removeEventListener('mouseup', stopResize);
                    
                    // If it was a quick click without much movement, toggle drawer
                    const clickDuration = Date.now() - clickStartTime;
                    const clickMovement = Math.abs(e.clientY - clickStartY);
                    
                    if (clickDuration < 200 && clickMovement < 5) {
                        toggleDrawer();
                    }
                    
                    isResizing = false;
                });
                
                e.preventDefault();
            });
        }

        function handleResize(e) {
            if (!isResizing) return;
            
            const drawer = document.getElementById('bottom-drawer');
            const deltaY = startY - e.clientY; // Inverted because we're measuring from bottom
            const newHeight = startHeight + deltaY;
            
            // Constrain height between min and max
            const minHeight = 200;
            const maxHeight = window.innerHeight * 0.8;
            const constrainedHeight = Math.max(minHeight, Math.min(maxHeight, newHeight));
            
            drawer.style.height = constrainedHeight + 'px';
            
            // Trigger chart resize if drawer is open
            if (isDrawerOpen && currentTab === 'overview') {
                setTimeout(() => {
                    // Resize charts after layout change
                    const pulseChart = echarts.getInstanceByDom(document.getElementById('retrofit-pulse-chart'));
                    const leaderboardChart = echarts.getInstanceByDom(document.getElementById('processing-leaderboard-chart'));
                    
                    if (pulseChart) pulseChart.resize();
                    if (leaderboardChart) leaderboardChart.resize();
                }, 50);
            }
        }

            const drawer = document.getElementById('bottom-drawer');
            isDrawerOpen = !isDrawerOpen;
            
            if (isDrawerOpen) {
                drawer.classList.add('open');

            } else {
                drawer.classList.remove('open');
            }

        // Generate weekly data for retrofit activity pulse from CSV
        async function generateRetrofitPulseData() {
            const weeklyData = await loadCSVData('retrofit_activity_weekly.csv');
            
            if (weeklyData.length === 0) {
                console.error('No weekly data loaded, falling back to empty data');
                return [];
            }
            
            console.log('Loaded weekly retrofit data:', weeklyData.length, 'weeks');
            
            // Convert to expected format and sort by week_start
            const weeks = weeklyData.map(row => ({
                week: row.iso_year_week,
                weekStart: new Date(row.week_start),
                HEAT_PUMP: row.HEAT_PUMP || 0,
                INSULATION: row.INSULATION || 0,
                ELECTRICAL_UPGRADE: row.ELECTRICAL_UPGRADE || 0,
                ENVELOPE: row.ENVELOPE || 0,
                HVAC_GENERAL: row.HVAC_GENERAL || 0,
                LIGHTING_RETROFIT: row.LIGHTING_RETROFIT || 0,
                total: row.unique_total || 0,
                stackedTotal: row.stacked_total || 0,
                rollingAverage: row.rolling_avg_4w || 0
            })).sort((a, b) => a.weekStart - b.weekStart);
            
            // Take last 52 weeks for the chart
            return weeks.slice(-52);
        }
        
        // Generate processing time leaderboard data from CSV
        async function generateProcessingLeaderboardData() {
            const wardProcessingData = await loadCSVData('processing_time_by_ward.csv');
            
            if (wardProcessingData.length === 0) {
                console.error('No ward processing data loaded, falling back to empty data');
                return { wards: [], cityMedian: 30 };
            }
            
            console.log('Loaded ward processing data:', wardProcessingData.length, 'wards');
            
            // Sort by median processing time (fastest first) and take top 12
            const sortedWards = wardProcessingData
                .filter(ward => ward.WARD && ward.median_days > 0)
                .sort((a, b) => a.median_days - b.median_days)
                .slice(0, 12);
            
            // Calculate city median from all wards
            const allMedians = wardProcessingData
                .filter(ward => ward.median_days > 0)
                .map(ward => ward.median_days);
            const cityMedian = allMedians.length > 0 ? 
                Math.round((allMedians.reduce((sum, val) => sum + val, 0) / allMedians.length) * 10) / 10 : 30;
            
            const wardLeaderboard = sortedWards.map(ward => ({
                ward: ward.WARD,
                volume: ward.permits || 0,
                retrofitLikely: 0, // Not available in processing CSV
                retrofitRate: 0,   // Not available in processing CSV
                median: ward.median_days,
                p25: ward.p25 || Math.round(ward.median_days * 0.75),
                p75: ward.p75 || Math.round(ward.median_days * 1.35),
                isFasterThanCity: ward.median_days < cityMedian
            }));
            
            console.log('Ward leaderboard generated:', wardLeaderboard.length, 'wards, city median:', cityMedian);
            
            return { wards: wardLeaderboard, cityMedian: cityMedian };
        }

        // Generate cumulative retrofit data over time from CSV
        async function generateCumulativeRetrofitData() {
            const weeklyData = await loadCSVData('retrofit_activity_weekly.csv');
            
            if (weeklyData.length === 0) {
                console.error('No weekly data loaded for cumulative chart');
                return [];
            }
            
            // Sort by week_start and compute cumulative sums
            const sortedWeeks = weeklyData
                .map(row => ({
                    week: row.iso_year_week,
                    date: new Date(row.week_start),
                    HEAT_PUMP: row.HEAT_PUMP || 0,
                    INSULATION: row.INSULATION || 0,
                    ELECTRICAL_UPGRADE: row.ELECTRICAL_UPGRADE || 0,
                    ENVELOPE: row.ENVELOPE || 0,
                    HVAC_GENERAL: row.HVAC_GENERAL || 0,
                    LIGHTING_RETROFIT: row.LIGHTING_RETROFIT || 0
                }))
                .sort((a, b) => a.date - b.date);
            
            // Calculate cumulative totals
            let cumulativeTotals = {
                HEAT_PUMP: 0,
                INSULATION: 0,
                ELECTRICAL_UPGRADE: 0,
                ENVELOPE: 0,
                HVAC_GENERAL: 0,
                LIGHTING_RETROFIT: 0
            };
            
            const weeks = sortedWeeks.map(week => {
                // Add this week's counts to cumulative totals
                Object.keys(cumulativeTotals).forEach(category => {
                    cumulativeTotals[category] += week[category];
                });
                
                return {
                    week: week.week,
                    date: week.date,
                    ...{ ...cumulativeTotals } // Clone current cumulative state
                };
            });
            
            // Take last 72 weeks (18 months) for the chart
            return weeks.slice(-72);
        }

        // Generate ward processing leaderboard data from CSV
        async function generateWardProcessingLeaderboardData() {
            const wardProcessingData = await loadCSVData('processing_time_by_ward.csv');
            
            if (wardProcessingData.length === 0) {
                console.error('No ward processing data loaded');
                return {
                    wards: [],
                    cityMedian: 0
                };
            }
            
            console.log('Loaded ward processing data:', wardProcessingData.length, 'wards');
            
            // Create leaderboard by processing time (ascending - fastest first)
            const wards = wardProcessingData
                .filter(row => row.WARD && row.median_days !== undefined && parseInt(row.permits) > 0)
                .map(row => ({
                    ward: `Ward ${row.WARD}`,
                    wardNum: row.WARD,
                    medianTime: parseFloat(row.median_days),
                    p25: parseFloat(row.p25) || parseFloat(row.median_days) * 0.7,
                    p75: parseFloat(row.p75) || parseFloat(row.median_days) * 1.4,
                    volume: parseInt(row.permits),
                    retrofitLikely: parseInt(row.retrofit_permits) || 0,
                    retrofitRate: Math.round((parseInt(row.retrofit_permits) || 0) / parseInt(row.permits) * 100),
                    complexity: (parseInt(row.retrofit_permits) || 0) / parseInt(row.permits)
                }))
                .sort((a, b) => a.medianTime - b.medianTime); // Sort fastest to slowest
            
            const cityMedian = wards.reduce((sum, w) => sum + w.medianTime, 0) / wards.length;
            
            return {
                wards: wards,
                cityMedian: Math.round(cityMedian * 10) / 10
            };
        }

                        itemStyle: { color: categoryColors.envelope },
                        symbol: 'roundRect',
                        symbolSize: 4,
                        smooth: true
                    },
                    {
                        name: 'hvac',
                        type: 'line',
                        data: timelineData.map(d => d.hvac),
                        lineStyle: { color: categoryColors.hvac, width: 2, type: 'dashed' },
                        itemStyle: { color: categoryColors.hvac },
                        symbol: 'pin',
                        symbolSize: 4,
                        smooth: true
                    },
                    {
                        name: 'lighting',
                        type: 'line',
                        data: timelineData.map(d => d.lighting),
                        lineStyle: { color: categoryColors.lighting, width: 2, type: 'dashed' },
                        itemStyle: { color: categoryColors.lighting },
                        symbol: 'arrow',
                        symbolSize: 4,
                        smooth: true
                    }
                ]
            };
            
            chart.setOption(option);
            
            const handleResize = () => chart.resize();
            window.addEventListener('resize', handleResize);
            chartElement._chartInstance = chart;
        }
        
        // Initialize summary window drag functionality on page load
        initSummaryWindowDrag();
    </script>
</body>
</html>
