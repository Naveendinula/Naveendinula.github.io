<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Permit Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', 'monospace'],
                    },
                    colors: {
                        'glass': {
                            50: 'rgba(255, 255, 255, 0.05)',
                            100: 'rgba(255, 255, 255, 0.1)',
                            200: 'rgba(255, 255, 255, 0.15)',
                        },
                        'dark': {
                            800: 'rgba(15, 15, 15, 0.95)',
                            900: 'rgba(0, 0, 0, 0.95)',
                        }
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            overflow: hidden;
        }
        
        /* Custom Tailwind Components */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        /* Enhanced Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: linear-gradient(145deg, rgba(55, 65, 81, 0.8), rgba(31, 41, 55, 0.9));
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(75, 85, 99, 0.5);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch.active {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        .toggle-slider {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 20px;
            height: 20px;
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        /* Enhanced Popup Styling */
        .mapboxgl-popup-content {
            background: rgba(15, 15, 15, 0.95);
            color: #ffffff;
            border-radius: 12px;
            padding: 16px;
            min-width: 280px;
            max-width: 350px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8), 0 4px 16px rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(20px);
            font-family: 'JetBrains Mono', monospace;
        }
        .mapboxgl-popup-content h3 {
            margin: 0 0 12px 0;
            color: #60a5fa;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            padding-bottom: 8px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .mapboxgl-popup-close-button {
            color: #ffffff;
            font-size: 20px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .mapboxgl-popup-close-button:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        /* --- Enhanced Popup Styling --- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .stat-card {
            position: relative;
            background: linear-gradient(145deg, rgba(30,41,59,0.85), rgba(17,24,39,0.85));
            padding: 8px 10px 10px 10px;
            border-radius: 8px;
            border: 1px solid rgba(59,130,246,0.25);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 2px 6px -1px rgba(0,0,0,0.6);
        }
        .stat-card:before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, #1d4ed8, #3b82f6, #60a5fa);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            opacity: 0.9;
        }
        .stat-label { font-size: 10px; letter-spacing: .3px; text-transform: uppercase; color: #93c5fd; font-weight: 600; }
        .stat-value { font-size: 16px; font-weight: 700; color: #ffffff; line-height: 1.1; margin-top: 3px; }
        .stat-sub { font-size: 10px; color: #9ca3af; margin-top: 2px; }
        .progress-wrapper { margin: 3px 0 12px 0; }
        .progress-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
        .progress-head span { font-size:11px; font-weight:600; color:#d1d5db; }
        .progress-bar { position:relative; background:rgba(31,41,55,0.6); border:1px solid rgba(59,130,246,0.3); height:12px; border-radius:6px; overflow:hidden; }
        .progress-fill { position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,#1d4ed8,#2563eb,#3b82f6); box-shadow:0 0 6px #3b82f6aa; }
        .category-chips { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 10px 0; }
        .chip { font-size:10px; padding:3px 6px; border-radius:12px; background:rgba(59,130,246,0.12); border:1px solid rgba(59,130,246,0.35); color:#bfdbfe; display:inline-flex; align-items:center; gap:3px; }
        .chip-count { background:#3b82f6; color:#fff; font-weight:600; font-size:9px; padding:1px 5px; border-radius:10px; }
        .mini-bars { display:flex; flex-direction:column; gap:6px; }
        .mini-row { display:grid; grid-template-columns:80px 1fr 35px; gap:6px; align-items:center; }
        .mini-label { font-size:10px; color:#9ca3af; font-weight:500; }
        .mini-bar { position:relative; background:rgba(31,41,55,0.55); height:8px; border-radius:4px; overflow:hidden; border:1px solid rgba(59,130,246,0.25); }
        .mini-fill { position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,#0ea5e9,#3b82f6); }
        .mini-val { font-size:10px; font-weight:600; color:#e5e7eb; text-align:right; }
        .section-title { font-size:11px; font-weight:700; letter-spacing:.3px; color:#60a5fa; margin:0 0 6px 0; text-transform:uppercase; }
        .divider { margin:12px 0 8px 0; height:1px; background:linear-gradient(90deg,transparent,rgba(59,130,246,0.5),transparent); border:none; }
        .empty-msg { font-size:11px; color:#9ca3af; font-style:italic; padding:6px 0; }
        
        /* --- Bottom Drawer Styles --- */
        .bottom-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45vh;
            min-height: 200px;
            max-height: 80vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px 12px 0 0;
            color: white;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
            resize: vertical;
            overflow: hidden;
        }
        .bottom-drawer.open {
            transform: translateY(0);
        }
        .drawer-handle {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            cursor: ns-resize;
            transition: background-color 0.2s;
            position: relative;
            user-select: none;
        }
        .drawer-handle:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .handle-bar {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            transition: background-color 0.2s;
            pointer-events: none;
        }
        .drawer-handle:hover .handle-bar {
            background: rgba(255, 255, 255, 0.5);
        }
        .resize-indicator {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .drawer-handle:hover .resize-indicator {
            opacity: 1;
        }
        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }
        .drawer-title h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #60a5fa;
        }
        .feature-count {
            font-size: 12px;
            color: #94a3b8;
            margin-left: 12px;
        }
        .close-button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .close-button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .tab-navigation {
            display: flex;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-navigation::-webkit-scrollbar {
            display: none;
        }
        .tab-button {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 13px;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
        }
        .tab-button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }
        .tab-button.active {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            border-bottom-color: #60a5fa;
        }
        .tab-icon {
            font-size: 14px;
        }
        .tab-label {
            font-weight: 500;
        }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scrollbar-width: thin;
            scrollbar-color: rgba(96, 165, 250, 0.6) rgba(255, 255, 255, 0.1);
        }
        .tab-content::-webkit-scrollbar {
            width: 8px;
        }
        .tab-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .tab-content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(96, 165, 250, 0.8), rgba(59, 130, 246, 0.6));
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-content::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, rgba(96, 165, 250, 1), rgba(59, 130, 246, 0.8));
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .kpi-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kpi-value {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .kpi-unit {
            font-size: 14px;
            color: #94a3b8;
        }
        /* Enhanced Chart Containers */
        .chart-container {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.6), rgba(30, 41, 59, 0.4));
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .chart-container:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .chart-title {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .chart-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
            font-style: italic;
        }
        .chart-content {
            height: 300px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .charts-grid {
            display: grid;
            gap: 24px;
        }
        .charts-grid.two-column {
            grid-template-columns: 1fr 1fr;
        }
        @media (max-width: 768px) {
            .charts-grid.two-column {
                grid-template-columns: 1fr;
            }
        }

        .provenance-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
        }
        .provenance-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #93c5fd;
            margin-bottom: 8px;
        }
        .provenance-grid {
            display: grid;
            gap: 8px;
        }
        .provenance-item {
            display: flex;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .provenance-item span:first-child {
            color: #cbd5e1;
            min-width: 120px;
            font-weight: 600;
        }
        .provenance-warning {
            margin-top: 10px;
            font-size: 12px;
            color: #fbbf24;
        }
        .chart-empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #94a3b8;
        }
        
        /* Enhanced Loading States */
        .loading {
            text-align: center;
            color: #9ca3af;
            font-style: italic;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Glassmorphism Effects */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        /* Enhanced Animations */
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @media (max-width: 1024px) {
            .charts-grid.two-column {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .bottom-drawer {
                height: 60vh;
            }
            .drawer-header {
                padding: 12px 16px;
            }
            .tab-content {
                padding: 16px;
            }
            .tab-button {
                padding: 10px 12px;
                font-size: 12px;
            }
        }
        
        .drawer-open-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .drawer-open-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
        }
        
        details.popup-details {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
        }
        details.popup-details summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            color: #bfdbfe;
            font-weight: 700;
            border-radius: 8px;
        }
        details.popup-details summary::-webkit-details-marker { display: none; }
        .summary-label { display:flex; gap:8px; align-items:center; }
        .summary-chevron { transition: transform 0.22s ease; color:#93c5fd; }
        details[open] .summary-chevron { transform: rotate(90deg); }
        .popup-details-content { margin-top:8px; padding-top:8px; border-top:1px dashed rgba(59,130,246,0.12); }
        
        /* Summary Window Styles */
        .summary-window {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            max-height: 70vh;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            z-index: 1050;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .summary-window.visible {
            opacity: 1;
            visibility: visible;
        }
        
        /* Hover Tooltip Styles */
        .hover-tooltip .mapboxgl-popup-content {
            background: rgba(0, 0, 0, 0.9);
            color: #ffffff;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            min-width: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .hover-tooltip .mapboxgl-popup-tip {
            border-top-color: rgba(0, 0, 0, 0.9);
        }
        .summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px 12px 0 0;
            cursor: move;
            user-select: none;
        }
        .summary-title {
            font-size: 16px;
            font-weight: 700;
            color: #60a5fa;
            margin: 0;
        }
        .summary-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .summary-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .summary-content {
            padding: 16px;
            overflow-y: auto;
            max-height: calc(70vh - 60px);
            scrollbar-width: thin;
            scrollbar-color: rgba(96, 165, 250, 0.6) rgba(255, 255, 255, 0.1);
        }
        .summary-content::-webkit-scrollbar {
            width: 6px;
        }
        .summary-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        .summary-content::-webkit-scrollbar-thumb {
            background: rgba(96, 165, 250, 0.6);
            border-radius: 3px;
        }
        .summary-section {
            margin-bottom: 20px;
        }
        .summary-section h4 {
            font-size: 14px;
            color: #93c5fd;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        .summary-item {
            font-size: 12px;
            color: #e2e8f0;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .summary-item strong {
            color: #60a5fa;
            font-weight: 600;
        }
        .summary-item .category {
            color: #a78bfa;
            font-weight: 500;
        }
        
        /* Back button styling (matches chicago-energy-retrofit.html) */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            z-index: 1100;
            transition: all 0.2s ease;
        }
        .back-button:hover { background: rgba(96, 165, 250, 0.12); color: #60a5fa; border-color: rgba(96, 165, 250, 0.28); }
        
        /* Loading Screen Styles */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        #loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid #60a5fa;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #60a5fa;
            font-size: 16px;
            font-weight: 500;
            margin-top: 10px;
        }
    </style>
</head>
